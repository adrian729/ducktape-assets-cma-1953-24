id: kneeling-blue-robed-angel-with-long-green-wings
title: Kneeling angel in blue, facing right
description: An angel kneels in profile facing right with hands joined, its face lifted upward, in a long blue robe with yellow-green highlights and gold hems that pools on the ground behind it. Two long pointed wings in blue and yellow-green sweep back to the lower left; the hair is bound with a red fillet and the burnished gold halo carries red flame marks. The background is transparent.
